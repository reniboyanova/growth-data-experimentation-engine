services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////home/appuser/data/growth.db
      EXECUTION_MODE: simulation
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    volumes: ["growth-app-data:/home/appuser/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  growth-app-data:
  ollama-data:
